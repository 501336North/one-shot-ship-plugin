name: Build oss-launch

# Self-contained oss-launch binaries (bundled Node) so a customer box can run per-agent local
# routing with NO system Node. Mirrors release-cli-decrypt.yml: esbuild -> .cjs -> @yao-pkg/pkg (from the
# watcher lockfile, node22; T71e: vercel pkg 5 is unmaintained, GHSA-22r3-9w55-cj54), building the
# arm64 target on a NATIVE arm64 runner (pkg compiles JS -> V8 bytecode per CPU arch and cannot
# cross-generate it).
on:
  push:
    tags:
      - 'oss-launch-v*'
  workflow_dispatch: {}

# Least privilege (T71e): nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node22-macos-arm64
            artifact: oss-launch-Darwin-arm64
          - os: macos-latest
            target: node22-macos-x64
            artifact: oss-launch-Darwin-x64
          - os: ubuntu-latest
            target: node22-linux-x64
            artifact: oss-launch-Linux-x64
          # MUST be a native arm64 runner — pkg cannot cross-generate arm64 V8 bytecode (a binary
          # built on x64 fails at runtime with a missing-snapshot-module error). Same lesson as
          # the oss-decrypt arm64 fix.
          - os: ubuntu-24.04-arm
            target: node22-linux-arm64
            artifact: oss-launch-Linux-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: watcher

      - name: Build bundle (tsc + esbuild standalone oss-launch.cjs)
        run: npm run build
        working-directory: watcher

      # @yao-pkg/pkg comes from the watcher lockfile (exact version, installed by npm ci above), never
      # from the registry at build time — the SHA-256 we publish must sign a reproducible build (T71e).
      - name: Build binary
        run: ./node_modules/.bin/pkg dist/cli/oss-launch.cjs --target ${{ matrix.target }} --output dist/bin/${{ matrix.artifact }}
        working-directory: watcher

      - name: Smoke — binary runs WITHOUT a system Node (the customer-box guarantee)
        run: |
          # Strip Node from PATH; a pkg binary embeds its own runtime so --version must still work.
          out="$(env PATH=/usr/bin:/bin dist/bin/${{ matrix.artifact }} --version)"
          echo "version output: $out"
          case "$out" in oss-launch\ *) echo "OK: standalone --version" ;; *) echo "FAIL"; exit 1 ;; esac
        working-directory: watcher

      - name: Generate SHA-256 checksum
        run: shasum -a 256 dist/bin/${{ matrix.artifact }} > dist/bin/${{ matrix.artifact }}.sha256
        working-directory: watcher

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: watcher/dist/bin/${{ matrix.artifact }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}.sha256
          path: watcher/dist/bin/${{ matrix.artifact }}.sha256

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/oss-launch-Darwin-arm64/oss-launch-Darwin-arm64
            artifacts/oss-launch-Darwin-x64/oss-launch-Darwin-x64
            artifacts/oss-launch-Linux-x64/oss-launch-Linux-x64
            artifacts/oss-launch-Linux-arm64/oss-launch-Linux-arm64
            artifacts/oss-launch-Darwin-arm64.sha256/oss-launch-Darwin-arm64.sha256
            artifacts/oss-launch-Darwin-x64.sha256/oss-launch-Darwin-x64.sha256
            artifacts/oss-launch-Linux-x64.sha256/oss-launch-Linux-x64.sha256
            artifacts/oss-launch-Linux-arm64.sha256/oss-launch-Linux-arm64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An oss-launch release must never become GitHub "Latest": plugin versions before the
      # decrypt-download-pin fix install oss-decrypt from releases/latest/download, which 404'd for every
      # new user from 2026-06-28 to 2026-10-09 when oss-launch-v2.0.78 took Latest. Latest is set to the
      # EXACT tag the plugin pins (single source: hooks/ensure-decrypt-cli.sh), never the newest one.
      - name: Keep Latest on cli-decrypt
        if: always()   # also when Create Release failed after it already took Latest
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(grep -oE 'OSS_DECRYPT_TAG:-cli-decrypt-v[0-9]+\.[0-9]+\.[0-9]+' hooks/ensure-decrypt-cli.sh | head -n1 | sed 's/.*:-//')"
          if [ -z "$tag" ]; then
            echo "::error::could not read the pinned cli-decrypt tag from hooks/ensure-decrypt-cli.sh"
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
