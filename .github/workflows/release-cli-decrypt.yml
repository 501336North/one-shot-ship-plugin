name: Release CLI Decrypt

on:
  push:
    tags:
      - 'cli-decrypt-v*'

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node22-macos-arm64
            artifact: oss-decrypt-Darwin-arm64
          - os: macos-latest
            target: node22-macos-x64
            artifact: oss-decrypt-Darwin-x64
          - os: ubuntu-latest
            target: node22-linux-x64
            artifact: oss-decrypt-Linux-x64
          # MUST be a native arm64 runner: pkg compiles JS -> V8 bytecode per CPU
          # arch and cannot cross-generate it. Building this target on an x64 runner
          # produces an arm64 ELF whose snapshot is missing the entry module
          # (`Cannot find module '/snapshot/dist/oss-decrypt.cjs'` at runtime).
          - os: ubuntu-24.04-arm
            target: node22-linux-arm64
            artifact: oss-decrypt-Linux-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Runs before npm ci: needs only node, package.json and src/index.ts.
      # A release once shipped with package.json bumped but VERSION in src/index.ts
      # not, so the binary reported a stale version. Refuse to build on any mismatch.
      - name: Check tag matches version
        working-directory: packages/cli-decrypt
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#cli-decrypt-v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/index.ts)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$src" ]; then
            echo "::error::tag version '$tag' must equal package.json version '$pkg' and src/index.ts VERSION '$src'"
            exit 1
          fi
          echo "tag, package.json and VERSION all = $tag"

      - name: Install dependencies
        run: npm ci
        working-directory: packages/cli-decrypt

      - name: Build bundle
        run: npm run build:bundle
        working-directory: packages/cli-decrypt

      - name: Build binary
        run: ./node_modules/.bin/pkg dist/oss-decrypt.cjs --target ${{ matrix.target }} --output dist/bin/${{ matrix.artifact }}
        working-directory: packages/cli-decrypt

      - name: Generate SHA-256 checksum
        run: shasum -a 256 dist/bin/${{ matrix.artifact }} > dist/bin/${{ matrix.artifact }}.sha256
        working-directory: packages/cli-decrypt

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli-decrypt/dist/bin/${{ matrix.artifact }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}.sha256
          path: packages/cli-decrypt/dist/bin/${{ matrix.artifact }}.sha256

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/oss-decrypt-Darwin-arm64/oss-decrypt-Darwin-arm64
            artifacts/oss-decrypt-Darwin-x64/oss-decrypt-Darwin-x64
            artifacts/oss-decrypt-Linux-x64/oss-decrypt-Linux-x64
            artifacts/oss-decrypt-Linux-arm64/oss-decrypt-Linux-arm64
            artifacts/oss-decrypt-Darwin-arm64.sha256/oss-decrypt-Darwin-arm64.sha256
            artifacts/oss-decrypt-Darwin-x64.sha256/oss-decrypt-Darwin-x64.sha256
            artifacts/oss-decrypt-Linux-x64.sha256/oss-decrypt-Linux-x64.sha256
            artifacts/oss-decrypt-Linux-arm64.sha256/oss-decrypt-Linux-arm64.sha256
          generate_release_notes: true
          # Beta CLI (tag version with a pre-release part, e.g. cli-decrypt-v1.3.0-beta.1): a pre-release that
          # never takes "Latest" (release channels ADR-005; the 2026-06-28 "Latest" incident). Stable: unchanged.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
